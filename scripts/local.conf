<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.conf.dtd">
<!--
  Managed by zoom-stream fix-fonts-and-browser.sh. Safe to re-run; this
  file is fully overwritten each time, not appended to.
-->
<fontconfig>
  <!-- Default family aliases -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Liberation Sans</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans CJK KR</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Liberation Serif</family>
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>DejaVu Sans Mono</family>
      <family>Liberation Mono</family>
    </prefer>
  </alias>
  <alias>
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Sinhala fallback: chain into the default families so any text run
       containing Sinhala code points picks up glyphs even when the
       requested family is Latin-only (e.g. "Arial", "Liberation Sans"). -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>si</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Sinhala</string>
      <string>LKLUG</string>
    </edit>
  </match>

  <!-- Tamil fallback (covered by Noto Sans CJK's Latin+Tamil-adjacent
       coverage is insufficient; Noto Sans core includes Tamil glyphs via
       fonts-noto-core's "Noto Sans Tamil"). -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ta</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Tamil</string>
    </edit>
  </match>

  <!-- CJK fallback -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ja</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh-cn</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh-tw</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK TC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ko</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK KR</string>
    </edit>
  </match>

  <!-- Rendering quality tuned for streaming clarity -->
  <match target="font">
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>
    <edit name="rgba" mode="assign">
      <const>none</const>
    </edit>
  </match>
</fontconfig>
