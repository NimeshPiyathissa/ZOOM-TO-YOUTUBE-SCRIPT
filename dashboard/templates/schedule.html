{% extends "base.html" %}
{% from "_macros.html" import icon %}
{% block title %}Schedule - Zoom Stream Dashboard{% endblock %}
{% block content %}

    <h2>Scheduled start/stop</h2>
    <span class="hint m-0">Asia/Colombo - join early, go live on time, stop + leave automatically</span>

{% endblock %}
{% block scripts %}
<script src="{{ static_url('js/schedule.js') }}"></script>
{% endblock %}
