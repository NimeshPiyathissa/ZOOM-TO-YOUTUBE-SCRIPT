[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Deliberately narrow: catch real bugs (undefined names, unused imports,
# broken f-strings, bare excepts hiding errors) without forcing a
# repo-wide reformat of an existing, working codebase that wasn't written
# against ruff's full default rule set. Widen this over time, not all at
# once in the same pass that adds CI.
select = ["E9", "F"]
ignore = [
    "F401",  # unused imports - several modules import a name for a lazy
             # `from . import X` re-export pattern used elsewhere in this
             # codebase; revisit narrowing this once those are audited.
]
# flake8-bugbear (B) deliberately left out of `select` for this first CI
# pass - it flags ~30 pre-existing `raise X` sites that should be
# `raise X from err`, which is real but unrelated to what this pass is
# for. Worth doing as its own, reviewed change - add "B" back then.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]  # test fixtures/mocks commonly bind a name only for its side effect
